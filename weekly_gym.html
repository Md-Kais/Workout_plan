<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Weekly Gym Plan</title>
  <meta name="description"
    content="Personal weekly gym tracker — workout plans, progress tracking, daily motivation." />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymPlan" />
  <link id="pwa-manifest" rel="manifest" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg-page: #0f1117;
      --bg-primary: #181b24;
      --bg-secondary: #1e2130;
      --bg-card: #242838;
      --bg-hover: #2a2f45;
      --border-p: rgba(255, 255, 255, 0.09);
      --border-s: rgba(255, 255, 255, 0.055);
      --text-p: #f0f2f8;
      --text-s: #8b92a8;
      --text-t: #565d73;
      --text-info: #7eb8f7;
      --text-ok: #5ddba7;
      --accent-blue: #3b82f6;
      --accent-teal: #14b8a6;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 18px;
      /* legacy aliases */
      --color-background-primary: var(--bg-primary);
      --color-background-secondary: var(--bg-secondary);
      --color-background-info: rgba(59, 130, 246, 0.12);
      --color-border-primary: var(--border-p);
      --color-border-secondary: var(--border-s);
      --color-border-tertiary: var(--border-s);
      --color-border-info: rgba(59, 130, 246, 0.35);
      --color-border-success: rgba(34, 197, 94, 0.25);
      --color-text-primary: var(--text-p);
      --color-text-secondary: var(--text-s);
      --color-text-tertiary: var(--text-t);
      --color-text-info: var(--text-info);
      --color-text-success: var(--text-ok);
      --border-radius-md: var(--r-md);
      --border-radius-lg: var(--r-lg);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text-p);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .app-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 5rem;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .app-header {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-teal));
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(59, 130, 246, 0.3);
    }

    .header-text h1 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-s);
      margin-top: 2px;
    }

    /* ── Tabs ───────────────────────────────────────────────── */
    .day-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      background: var(--bg-secondary);
      padding: 5px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border-p);
    }

    .day-tab {
      padding: 7px 12px;
      border-radius: var(--r-md);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-s);
      transition: all 0.15s;
      flex: 1;
      text-align: center;
      min-width: 66px;
      position: relative;
    }

    .day-tab:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-p);
    }

    .day-tab.active {
      background: var(--bg-card);
      color: var(--text-p);
      border-color: var(--border-p);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .day-tab.today-tab::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-teal);
    }

    /* small done-badge on tab */
    .tab-done-dot {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 1.5px solid var(--bg-secondary);
    }

    /* ── Motivation Banner ──────────────────────────────────── */
    .quote-banner {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(20, 184, 166, 0.08));
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--r-xl);
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      position: relative;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quote-icon {
      font-size: 22px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .quote-text-wrap {
      flex: 1;
    }

    .quote-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-p);
      font-style: italic;
      transition: opacity 0.4s;
    }

    .quote-author {
      font-size: 11px;
      color: var(--text-s);
      margin-top: 3px;
      font-style: normal;
    }

    .quote-refresh {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-p);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      transition: all 0.15s;
      color: var(--text-s);
    }

    .quote-refresh:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-p);
      transform: rotate(20deg);
    }

    .quote-refresh.spinning {
      animation: spin 0.5s linear;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Progress Panel (overview) ──────────────────────────── */
    .progress-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-xl);
      padding: 1.1rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .progress-panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-t);
      margin-bottom: 0.9rem;
    }

    .progress-week-label {
      font-size: 12px;
      color: var(--text-s);
      margin-bottom: 0.65rem;
    }

    .progress-week-label span {
      color: var(--text-p);
      font-weight: 600;
    }

    .progress-bar-wrap {
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.85rem;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-teal));
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-days-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .pd-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .pd-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border-p);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.25s;
      background: var(--bg-secondary);
    }

    .pd-dot.done {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.4);
    }

    .pd-dot.today {
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2);
    }

    .pd-label {
      font-size: 9.5px;
      color: var(--text-t);
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .progress-reset-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.75rem;
    }

    .reset-btn {
      font-size: 11px;
      color: var(--text-t);
      cursor: pointer;
      padding: 3px 8px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-s);
      background: transparent;
      transition: all 0.15s;
    }

    .reset-btn:hover {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.07);
    }

    /* ── Section Label / Divider ────────────────────────────── */
    .sec-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-t);
      margin-bottom: 0.85rem;
      margin-top: 1.5rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-s);
      margin: 1.25rem 0;
    }

    /* ── Week Overview ──────────────────────────────────────── */
    .week-overview {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .wo-card {
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-lg);
      padding: 0.85rem 0.6rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
      overflow: hidden;
    }

    .wo-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
    }

    .wo-card.wo-done {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.05);
    }

    .wo-done-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #fff;
      font-weight: 700;
    }

    .wo-day {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-t);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .wo-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-p);
      margin-bottom: 7px;
      line-height: 1.35;
    }

    .wo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: 0 auto 4px;
    }

    .wo-kcal {
      font-size: 10px;
      color: var(--text-t);
      font-family: 'DM Mono', monospace;
    }

    /* ── Equipment ──────────────────────────────────────────── */
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .equip-card {
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-lg);
      padding: 0.9rem 1rem;
      transition: border-color 0.15s;
    }

    .equip-card:hover {
      border-color: rgba(255, 255, 255, 0.13);
    }

    .equip-card .ecat {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .equip-card h4 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-p);
      margin: 0 0 3px;
    }

    .equip-card p {
      font-size: 11px;
      color: var(--text-s);
      line-height: 1.55;
      margin: 0;
    }

    /* ── Day Header ─────────────────────────────────────────── */
    .day-header {
      border-radius: var(--r-xl);
      padding: 1.15rem 1.25rem;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .day-header h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 5px;
      letter-spacing: -0.3px;
    }

    .day-header p {
      font-size: 12.5px;
      margin: 0;
      line-height: 1.65;
      opacity: 0.85;
    }

    /* ── Summary Row ────────────────────────────────────────── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .scard {
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-md);
      padding: 0.8rem 1rem;
    }

    .scard .lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-t);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .scard .val {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-p);
      font-family: 'DM Mono', monospace;
    }

    /* ── Mark Day Done bar ──────────────────────────────────── */
    .day-done-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-lg);
      padding: 0.8rem 1rem;
      margin-bottom: 1.1rem;
      gap: 10px;
    }

    .day-done-bar p {
      font-size: 12.5px;
      color: var(--text-s);
    }

    .day-done-bar p strong {
      color: var(--text-p);
    }

    .mark-done-btn {
      padding: 7px 16px;
      border-radius: var(--r-md);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.12);
      color: #5ddba7;
      transition: all 0.18s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mark-done-btn:hover {
      background: rgba(34, 197, 94, 0.22);
    }

    .mark-done-btn.is-done {
      border-color: rgba(34, 197, 94, 0.6);
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
    }

    .mark-done-btn.is-done::before {
      content: '✓ ';
    }

    /* ── Timeline ───────────────────────────────────────────── */
    .timeline {
      display: flex;
      flex-direction: column;
    }

    .tl-item {
      display: grid;
      grid-template-columns: 66px 14px 1fr;
      gap: 0 13px;
      align-items: start;
    }

    .tl-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-t);
      font-family: 'DM Mono', monospace;
      padding-top: 17px;
      text-align: right;
    }

    .tl-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tl-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-top: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.5);
    }

    .tl-line {
      width: 2px;
      flex: 1;
      min-height: 18px;
      opacity: 0.3;
    }

    /* ── Timeline Card ──────────────────────────────────────── */
    .tl-card {
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-lg);
      padding: 0.88rem 1rem;
      margin: 5px 0 9px;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .tl-card:hover {
      border-color: rgba(255, 255, 255, 0.13);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.22);
    }

    .tl-card.block-done {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.04);
    }

    .tl-card .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tl-card h4 {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-p);
      margin: 0 0 4px;
      letter-spacing: -0.2px;
      padding-right: 36px;
    }

    .tl-card .sets {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-info);
      margin-bottom: 5px;
      font-family: 'DM Mono', monospace;
    }

    .tl-card p {
      font-size: 12px;
      color: var(--text-s);
      margin: 0;
      line-height: 1.65;
      white-space: pre-line;
    }

    .tl-card .equip {
      font-size: 11px;
      color: var(--text-t);
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid var(--border-s);
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .tl-card .equip::before {
      content: '🔧';
      font-size: 10px;
      margin-top: 1px;
    }

    .tl-card .tip {
      font-size: 11.5px;
      color: var(--text-ok);
      margin-top: 7px;
      padding: 7px 10px;
      border-radius: var(--r-sm);
      background: rgba(34, 197, 94, 0.07);
      border: 1px solid rgba(34, 197, 94, 0.14);
      line-height: 1.55;
    }

    .tl-card .tip::before {
      content: '💡 ';
    }

    /* ── Tick button ────────────────────────────────────────── */
    .tick-btn {
      position: absolute;
      bottom: 9px;
      right: 9px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border-p);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.2s;
      color: var(--text-t);
      -webkit-tap-highlight-color: transparent;
    }

    .tick-btn:hover {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.1);
      color: var(--text-ok);
    }

    .tick-btn.ticked {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.55);
      color: #4ade80;
    }

    @keyframes tickPop {
      0% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.35)
      }

      100% {
        transform: scale(1)
      }
    }

    .tick-btn.pop {
      animation: tickPop 0.25s ease;
    }

    /* ── Video ──────────────────────────────────────────────── */
    .video-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-info);
      padding: 6px 12px;
      border-radius: var(--r-md);
      border: 1px solid rgba(59, 130, 246, 0.28);
      background: rgba(59, 130, 246, 0.08);
      width: fit-content;
      user-select: none;
      transition: all 0.15s;
    }

    .video-toggle:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.45);
    }

    .video-wrap {
      margin-top: 10px;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      display: none;
      border: 1px solid var(--border-p);
    }

    .video-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-wrap.open {
      display: block;
    }

    /* ── Toaster ────────────────────────────────────────────── */
    #toaster {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border-p);
      border-radius: var(--r-lg);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-p);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 999;
      white-space: nowrap;
    }

    #toaster.show {
      opacity: 1;
    }

    /* ── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-page);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-p);
      border-radius: 3px;
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      .app-wrap {
        padding: 1rem 0.9rem 4rem;
      }

      .week-overview {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .equip-grid {
        grid-template-columns: 1fr;

    /* ════════════════════════════════════════════════════════════
       STORAGE — localStorage with weekly auto-expiry
       Key format: gymtracker_YYYY-Www  (ISO week)
    ═══════════════════════════════════════════════════════════════ */
    function getISOWeekKey() {
      const now = new Date();
      // ISO week number
      const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `gymtracker_${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function loadState() {
      try {
        const key = getISOWeekKey();
        const raw = localStorage.getItem(key);
        if (!raw) return { dayDone: {}, blockDone: {} };
        return JSON.parse(raw);
      } catch (e) { return { dayDone: {}, blockDone: {} }; }
    }

    function saveState(state) {
      try {
        // Remove old week keys
        const curKey = getISOWeekKey();
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('gymtracker_') && k !== curKey) {
            localStorage.removeItem(k); i--;
          }
        }
        localStorage.setItem(curKey, JSON.stringify(state));
      } catch (e) { }
    }

    let STATE = loadState();

    function isDayDone(dayIdx) { return !!STATE.dayDone[dayIdx]; }
    function isBlockDone(dayIdx, blockIdx) { return !!STATE.blockDone[`${dayIdx}_${blockIdx}`]; }

    function toggleBlock(dayIdx, blockIdx, el, tickBtn) {
      const key = `${dayIdx}_${blockIdx}`;
      const wasDone = !!STATE.blockDone[key];
      STATE.blockDone[key] = !wasDone;
      saveState(STATE);
      el.classList.toggle('block-done', !wasDone);
      tickBtn.classList.toggle('ticked', !wasDone);
      tickBtn.classList.add('pop');
      tickBtn.addEventListener('animationend', () => tickBtn.classList.remove('pop'), { once: true });
      toast(!wasDone ? '✓ Marked done' : 'Unmarked');
      updateTabBadges();
    }

    function toggleDayDone(dayIdx) {
      const wasDone = isDayDone(dayIdx);
      STATE.dayDone[dayIdx] = !wasDone;
      saveState(STATE);
      const btn = document.getElementById('markDoneBtn');
      if (btn) {
        btn.classList.toggle('is-done', !wasDone);
        btn.textContent = !wasDone ? 'Day Complete!' : 'Mark Day Done';
      }
      updateTabBadges();
      toast(!wasDone ? '🎉 Day marked complete!' : 'Day unmarked');
    }

    function resetWeek() {
      if (!confirm('Reset all tracking for this week?')) return;
      STATE = { dayDone: {}, blockDone: {} };
      saveState(STATE);
      updateTabBadges();
      showDay(0);
      toast('Week reset ✓');
    }

    function countDoneDays() {
      return Object.keys(STATE.dayDone).filter(k => STATE.dayDone[k]).length;
    }

    function updateTabBadges() {
      const tabs = document.querySelectorAll('.day-tab');
      // tabs: 0=overview, 1=Sun(day1)..6=Fri&Sat(day6)
      for (let i = 1; i <= 6; i++) {
        const tab = tabs[i];
        if (!tab) continue;
        const existing = tab.querySelector('.tab-done-dot');
        if (isDayDone(i)) {
          if (!existing) {
            const dot = document.createElement('span');
            dot.className = 'tab-done-dot';
            tab.appendChild(dot);
          }
        } else {
          if (existing) existing.remove();
        }
      }
    }

    /* ════════════════════════════════════════════════════════════
       QUOTES  — QuoteSlate (free, no key, CORS)
       Fallback: DummyJSON (also free, no key, CORS)
    ═══════════════════════════════════════════════════════════════ */
    // Curated fitness/discipline tags for QuoteSlate
    const QUOTE_TAGS = ['motivation', 'success', 'perseverance', 'discipline', 'health', 'wisdom', 'strength', 'goals'];

    // Fallback local quotes in case both APIs fail
    const LOCAL_QUOTES = [
      { q: "The body achieves what the mind believes.", a: "Napoleon Hill" },
      { q: "Take care of your body. It's the only place you have to live.", a: "Jim Rohn" },
      { q: "Success is the sum of small efforts repeated day in and day out.", a: "Robert Collier" },
      { q: "Your body can stand almost anything. It's your mind that you have to convince.", a: "Unknown" },
      { q: "The pain you feel today will be the strength you feel tomorrow.", a: "Arnold Schwarzenegger" },
      { q: "Don't wish for it, work for it.", a: "Unknown" },
      { q: "Discipline is the bridge between goals and accomplishment.", a: "Jim Rohn" },
      { q: "Believe in yourself and all that you are. Know that there is something inside you that is greater than any obstacle.", a: "Christian D. Larson" },
      { q: "Strive for progress, not perfection.", a: "Unknown" },
      { q: "The secret of getting ahead is getting started.", a: "Mark Twain" },
      { q: "If it doesn't challenge you, it doesn't change you.", a: "Fred DeVito" },
      { q: "Push yourself because no one else is going to do it for you.", a: "Unknown" },
      { q: "Great things never come from comfort zones.", a: "Unknown" },
      { q: "It's not about having time. It's about making time.", a: "Unknown" },
      { q: "The only bad workout is the one that didn't happen.", a: "Unknown" },
    ];

    let lastLocalIdx = -1;

    async function fetchQuote() {
      const textEl = document.getElementById('quoteText');
      const authorEl = document.getElementById('quoteAuthor');
      const refreshBtn = document.getElementById('quoteRefreshBtn');

      textEl.style.opacity = '0.3';
      refreshBtn.classList.add('spinning');

      const tag = QUOTE_TAGS[Math.floor(Math.random() * QUOTE_TAGS.length)];

      try {
        // Primary: QuoteSlate — free, no auth, CORS enabled
        const res = await fetch(`https://quoteslate.vercel.app/api/quotes/random?tags=${tag}`, { signal: AbortSignal.timeout(4000) });
        if (!res.ok) throw new Error('QuoteSlate failed');
        const data = await res.json();
        const quote = data.quote || data.content || data.text;
        const author = data.author || '';
        if (quote) {
          textEl.textContent = `"${quote}"`;
          authorEl.textContent = author ? `— ${author}` : '';
          textEl.style.opacity = '1';
          refreshBtn.classList.remove('spinning');
          return;
        }
        throw new Error('No quote content');
      } catch (e) {
        // Fallback: DummyJSON
        try {
          const res2 = await fetch('https://dummyjson.com/quotes/random', { signal: AbortSignal.timeout(4000) });
          if (!res2.ok) throw new Error('DummyJSON failed');
          const data2 = await res2.json();
          if (data2.quote) {
            textEl.textContent = `"${data2.quote}"`;
            authorEl.textContent = data2.author ? `— ${data2.author}` : '';
            textEl.style.opacity = '1';
            refreshBtn.classList.remove('spinning');
            return;
          }
          throw new Error('No quote content');
        } catch (e2) {
          // Last resort: local pool
          let idx;
          do { idx = Math.floor(Math.random() * LOCAL_QUOTES.length); }
          while (idx === lastLocalIdx && LOCAL_QUOTES.length > 1);
          lastLocalIdx = idx;
          const q = LOCAL_QUOTES[idx];
          textEl.textContent = `"${q.q}"`;
          authorEl.textContent = q.a ? `— ${q.a}` : '';
        }
      }
      textEl.style.opacity = '1';
      refreshBtn.classList.remove('spinning');
    }

    /* ════════════════════════════════════════════════════════════
       TOAST
    ═══════════════════════════════════════════════════════════════ */
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toaster');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    /* ════════════════════════════════════════════════════════════
       DATE / DAY LOGIC
    ═══════════════════════════════════════════════════════════════ */
    function getTodayTabIndex() {
      const dow = new Date().getDay(); // 0=Sun,1=Mon,...,6=Sat
      if (dow === 0) return 1;
      if (dow === 1) return 2;
      if (dow === 2) return 3;
      if (dow === 3) return 4;
      if (dow === 4) return 5;
      return 6; // Fri or Sat
    }

    function markTodayTab() {
      const idx = getTodayTabIndex();
      const tabs = document.querySelectorAll('.day-tab');
      if (tabs[idx]) tabs[idx].classList.add('today-tab');
    }

    function updateHeaderDate() {
      const now = new Date();
      document.getElementById('headerDate').textContent =
        now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
        ' · ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    /* ════════════════════════════════════════════════════════════
       RENDER
    ═══════════════════════════════════════════════════════════════ */
    function showDay(i) {
      document.querySelectorAll('.day-tab').forEach((t, j) => t.classList.toggle('active', j === i));
      const el = document.getElementById('content');

      if (i === 0) {
        // ── Overview ──────────────────────────────────────────────
        const done = countDoneDays();
        const total = 6;
        const pct = Math.round((done / total) * 100);
        const DOW_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const todayDow = new Date().getDay();
        // day tab indices: 1=Sun(0),2=Mon(1),...,5=Thu(4),6=Fri/Sat(5/6)
        const tabMap = [1, 2, 3, 4, 5, 6, 6]; // dow → tab index

        let daysRow = '';
        DOW_LABELS.forEach((lbl, dow) => {
          const tabIdx = tabMap[dow];
          const done_ = isDayDone(tabIdx);
          const isToday = dow === todayDow;
          daysRow += `<div class="pd-cell">
        <div class="pd-dot${done_ ? ' done' : ''}${isToday ? ' today' : ''}">${done_ ? '✓' : '·'}</div>
        <div class="pd-label">${lbl}</div>
      </div>`;
        });

        let h = `
      <div class="progress-panel">
        <div class="progress-panel-title">This week's progress</div>
        <div class="progress-week-label">You completed <span>${done} of ${total}</span> training days</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-days-row">${daysRow}</div>
        <div class="progress-reset-row"><button class="reset-btn" onclick="resetWeek()">Reset week</button></div>
      </div>
      <div class="sec-label">Weekly schedule — click a day</div>
      <div class="week-overview">`;

        overviewWeeks.forEach((w, idx) => {
          const tabIdx = idx + 1;
          const dayIsDone = isDayDone(tabIdx);
          h += `<div class="wo-card${dayIsDone ? ' wo-done' : ''}" onclick="showDay(${tabIdx})">
        ${dayIsDone ? '<div class="wo-done-badge">✓</div>' : ''}
        <div class="wo-day">${w.day}</div>
        <div class="wo-name">${w.name}</div>
        <div class="wo-dot" style="background:${w.color.dot}"></div>
        <div class="wo-kcal">${w.kcal} kcal</div>
      </div>`;
        });

        h += `</div><div class="divider"></div>
      <div class="sec-label">Your equipment — how each piece is used</div>
      <div class="equip-grid">`;
        equipment.forEach(e => {
          h += `<div class="equip-card">
        <div class="ecat" style="background:${e.catc.bg};color:${e.catc.tc}">${e.cat}</div>
        <h4>${e.name}</h4><p>${e.desc}</p>
      </div>`;
        });
        h += '</div>';
        el.innerHTML = h;
        return;
      }

      // ── Day View ───────────────────────────────────────────────
      const d = days[i];
      const c = d.color;
      const dayIsDone = isDayDone(i);

      let h = `<div class="day-header" style="background:${c.bg};color:${c.tc}">
    <h2>${d.name} — ${d.focus}</h2><p>${d.note}</p>
  </div>`;

      h += `<div class="summary-row">
    <div class="scard"><div class="lbl">Total time</div><div class="val">${d.stats[0]}</div></div>
    <div class="scard"><div class="lbl">Est. calories</div><div class="val">${d.stats[1]}</div></div>
    <div class="scard"><div class="lbl">Focus</div><div class="val" style="font-size:12px">${d.stats[2]}</div></div>
  </div>`;

      h += `<div class="day-done-bar">
    <p>Finished today's workout? <strong>Mark it done</strong> to track your week.</p>
    <button id="markDoneBtn" class="mark-done-btn${dayIsDone ? ' is-done' : ''}" onclick="toggleDayDone(${i})">
      ${dayIsDone ? 'Day Complete!' : 'Mark Day Done'}
    </button>
  </div>`;

      h += '<div class="timeline">';
      d.blocks.forEach((b, idx) => {
        const bc = b.tc;
        const last = idx === d.blocks.length - 1;
        const vid_id = `d${i}_b${idx}`;
        const blkDone = isBlockDone(i, idx);
        h += `<div class="tl-item">
      <div class="tl-time">${b.time}</div>
      <div class="tl-spine">
        <div class="tl-dot" style="background:${bc.dot}"></div>
        ${!last ? `<div class="tl-line" style="background:${bc.line}"></div>` : ''}
      </div>
      <div class="tl-card${blkDone ? ' block-done' : ''}" id="card_${i}_${idx}">
        <div class="tag" style="background:${bc.bg};color:${bc.tc}">${b.tag}</div>
        <h4>${b.label}</h4>
        ${b.sets ? `<div class="sets">${b.sets}</div>` : ''}
        <p>${b.desc}</p>
        ${b.equip ? `<div class="equip">${b.equip}</div>` : ''}
        ${b.tip ? `<div class="tip">${b.tip}</div>` : ''}
        ${b.video ? `
          <div class="video-toggle" id="vb-${vid_id}" onclick="toggleVideo('${vid_id}')">▶ Watch exercise video</div>
          <div class="video-wrap" id="vw-${vid_id}">
            <iframe src="${b.video}?rel=0&modestbranding=1" allowfullscreen loading="lazy"></iframe>
          </div>` : ''}
        <button class="tick-btn${blkDone ? ' ticked' : ''}" id="tick_${i}_${idx}"
          onclick="toggleBlock(${i},${idx},document.getElementById('card_${i}_${idx}'),this)"
          title="${blkDone ? 'Unmark' : 'Mark complete'}">
          ${blkDone ? '✓' : '○'}
        </button>
      </div>
    </div>`;
      });
      h += '</div>';
      el.innerHTML = h;
    }

    function toggleVideo(id) {
      const wrap = document.getElementById('vw-' + id);
      const btn = document.getElementById('vb-' + id);
      if (!wrap) return;
      const isOpen = wrap.classList.contains('open');
      wrap.classList.toggle('open', !isOpen);
      btn.textContent = isOpen ? '▶ Watch exercise video' : '✕ Hide video';
    }

    /* ════════════════════════════════════════════════════════════
       PWA — inline manifest (no server needed)
    ═══════════════════════════════════════════════════════════════ */
    function setupPWA() {
      const manifest = {
        name: "Weekly Gym Plan",
        short_name: "GymPlan",
        description: "Personal weekly gym tracker with workout plans and progress tracking.",
        start_url: "./",
        display: "standalone",
        background_color: "#0f1117",
        theme_color: "#0f1117",
        orientation: "portrait-primary",
        icons: [
          { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%230f1117'/%3E%3Ctext x='96' y='130' text-anchor='middle' font-size='110'%3E🏋️%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" },
          { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230f1117'/%3E%3Ctext x='256' y='350' text-anchor='middle' font-size='300'%3E🏋️%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);

      // Register inline service worker via blob
      if ('serviceWorker' in navigator) {
        const swCode = `
      const CACHE = 'gymplan-v1';
      const ASSETS = ['./', location.href];
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).catch(()=>{}));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys =>
          Promise.all(keys.filter(k => k!==CACHE).map(k => caches.delete(k)))
        ));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => cached))
        );
      });
    `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL, { scope: './' }).catch(() => { });
      }
    }

    /* ════════════════════════════════════════════════════════════
       INIT
    ═══════════════════════════════════════════════════════════════ */
    setupPWA();
    updateHeaderDate();
    setInterval(updateHeaderDate, 60000);
    markTodayTab();
    updateTabBadges();
    fetchQuote();
    showDay(getTodayTabIndex());
  </script>
